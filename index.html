<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Paxi 抽奖" />
<meta name="format-detection" content="telephone=no" />
<title>Paxi 抽奖</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<!--
  说明（给维护者）：
  · 本页只是门户，四套抽奖前端分别在 ./tkcc/ ./orion/ ./pick/ ./leo/，
    它们是同一份代码，只有 config.js / manifest.json / 图标文件不同。
  · 主站 paxi-game-hub 里的抽奖入口指向的就是本仓库根路径，所以门户放在根目录
    是刻意的 —— 主站一行都不用改。
  · 本页**故意不注册 Service Worker**：旧版根目录那个 scope=/ 的 SW 需要被
    根 sw.js（自杀脚本）顶掉，注册反而会来回反复。详见根 sw.js 的注释。
  · 每个子目录的链接用 "./xxx/" 结尾（目录形式），由 Pages 自动补 index.html，
    这样也保证了子站 SW 的 scope 天然限定在各自目录内。
  · 版式：**一行两个**。用户明确要求这站只在手机上用，所以断点按手机优先写：
    最窄 320px（iPhone SE 竖屏）时卡片仍为两列不折行。
  · 四站都已上线，卡片上原本的"营业中 / 即将开放"状态标签**整体去掉**了
    （不再区分可用性），右下角的箭头挪到卡片右上角，避免留下一个空行。
  · 各站的合约地址在各自 config.js 的 contract 字段，本页不涉及链上调用。
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --card: #171a21;
    --card-2: #12151c;
    --line: #262b36;
    --txt: #e6e9ef;
    --muted: #8b94a7;
    --gap: 11px;
    --pad: 14px;              /* 页面左右留白 */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--txt);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overflow-x: clip;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(900px 420px at 50% -10%, rgba(255, 107, 53, .16), transparent 70%),
      radial-gradient(700px 380px at 10% 110%, rgba(108, 92, 231, .14), transparent 70%);
    pointer-events: none;
  }
  .wrap {
    position: relative;
    max-width: 560px;
    margin: 0 auto;
    padding: calc(28px + env(safe-area-inset-top)) var(--pad) calc(24px + env(safe-area-inset-bottom));
  }

  header { text-align: center; margin-bottom: 20px; }
  .logo { font-size: 40px; line-height: 1; filter: drop-shadow(0 6px 18px rgba(255, 107, 53, .35)); }
  h1 { margin: 10px 0 5px; font-size: 22px; font-weight: 800; letter-spacing: .5px; }
  .sub { margin: 0; color: var(--muted); font-size: 13px; }

  /* ===== 一行两个 ===== */
  .list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--gap);
    align-items: stretch;
  }

  a.card {
    position: relative;
    display: flex; flex-direction: column;
    gap: 9px;
    padding: 13px 12px 12px;
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border: 1px solid var(--line);
    border-radius: 18px;
    text-decoration: none; color: inherit;
    overflow: hidden;
    min-width: 0;                       /* 关键：允许在 grid 里被压缩，否则会撑破一行 */
    transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease;
  }
  /* 卡片顶部一抹主色，代替原来的大色块 */
  a.card::after {
    content: "";
    position: absolute; inset: 0 0 auto;
    height: 3px;
    background: linear-gradient(90deg, var(--ac), var(--ac2));
    opacity: .9;
  }
  a.card:active { transform: scale(.975); }
  a.card:hover { border-color: var(--ac); box-shadow: 0 12px 34px -16px var(--ac); }

  .ic {
    width: 58px; height: 58px;
    border-radius: 16px;
    object-fit: cover;
    display: block;
    background: #0b0d12;
    box-shadow: 0 8px 20px -10px var(--ac), 0 0 0 1px rgba(255,255,255,.06) inset;
  }
  @media (max-width: 359px) {
    .ic { width: 48px; height: 48px; border-radius: 13px; }
  }

  .body { min-width: 0; }
  .name {
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px;
    font-size: 15px; font-weight: 700; letter-spacing: .2px;
  }
  /* 代币名整体不折行。窄屏（320px）时让代币徽标掉到第二行，
     而不是把名字截成"ORION…"。实测 320px 下名字最长 89px < 可用 115px，不会溢出。 */
  .name span.t { white-space: nowrap; }
  .sym {
    flex: 0 0 auto;
    font-size: 9.5px; font-weight: 700; letter-spacing: .3px;
    padding: 1px 6px; border-radius: 999px;
    color: var(--ac);
    background: color-mix(in srgb, var(--ac) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--ac) 38%, transparent);
  }
  .desc {
    margin-top: 4px;
    font-size: 11.5px; line-height: 1.45; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* 四站全部上线，不再需要"营业中 / 即将开放"状态标签，
     改为卡片右上角一个「进入」箭头（绝对定位，不额外占高度）。 */
  .go {
    position: absolute; top: 8px; right: 9px;
    color: var(--muted); font-size: 17px; line-height: 1;
    transition: color .14s ease, transform .14s ease;
  }
  a.card:hover .go, a.card:active .go { color: var(--ac); transform: translateX(1px); }

  footer { margin-top: 20px; text-align: center; color: var(--muted); font-size: 11.5px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🎰</div>
    <h1>Paxi 抽奖</h1>
    <p class="sub">选择一种代币，进入对应的抽奖大厅</p>
  </header>

  <div class="list">
    <a class="card" href="./tkcc/" style="--ac:#ff6b35; --ac2:#ff8f5e">
      <img class="ic" src="./tkcc/icon-128.png" alt="TKCC" width="58" height="58" decoding="async" />
      <div class="body">
        <div class="name"><span class="t">TKCC 抽奖</span><span class="sym">TKCC</span></div>
        <div class="desc">PAXI + TKCC 奖池 · 三档规格 · 满员自动开奖</div>
      </div>
      <span class="go">›</span>
    </a>

    <a class="card" href="./orion/" style="--ac:#6c5ce7; --ac2:#a29bfe">
      <img class="ic" src="./orion/icon-128.png" alt="ORION" width="58" height="58" decoding="async" />
      <div class="body">
        <div class="name"><span class="t">ORION 抽奖</span><span class="sym">ORION</span></div>
        <div class="desc">PAXI + ORION 奖池 · 三档规格 · 满员自动开奖</div>
      </div>
      <span class="go">›</span>
    </a>

    <a class="card" href="./pick/" style="--ac:#10b981; --ac2:#34d399">
      <img class="ic" src="./pick/icon-128.png" alt="PICK" width="58" height="58" decoding="async" />
      <div class="body">
        <div class="name"><span class="t">PICK 抽奖</span><span class="sym">PICK</span></div>
        <div class="desc">PAXI + PICK 奖池 · 三档规格 · 满员自动开奖</div>
      </div>
      <span class="go">›</span>
    </a>

    <a class="card" href="./leo/" style="--ac:#f5a623; --ac2:#ffd166">
      <img class="ic" src="./leo/icon-128.png" alt="LEO" width="58" height="58" decoding="async" />
      <div class="body">
        <div class="name"><span class="t">LEO 抽奖</span><span class="sym">LEO</span></div>
        <div class="desc">PAXI + LEO 奖池 · 三档规格 · 满员自动开奖</div>
      </div>
      <span class="go">›</span>
    </a>
  </div>

  <footer>
    请在 PaxiHub 中打开以使用钱包与无感签名 · <a href="https://paxinet.io" target="_blank" rel="noopener">paxinet.io</a>
  </footer>
</div>
</body>
</html>
